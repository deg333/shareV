<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #bg { position: fixed; inset: 0; background-size: 100% 100%; }
  #dim { position: fixed; inset: 0; background: rgba(0,0,0,.35); }
  #sel { position: fixed; display: none; border: 1px solid #4da3ff; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); box-sizing: border-box; }
  .g { position: fixed; background: rgba(77,163,255,.55); pointer-events: none; }
  #gv { top: 0; bottom: 0; width: 1px; } #gh { left: 0; right: 0; height: 1px; }
  #lbl { position: fixed; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(20,20,24,.85);
         padding: 3px 7px; border-radius: 4px; pointer-events: none; white-space: nowrap; display: none; }
  #hint { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font: 13px system-ui, sans-serif; color: #fff;
          background: rgba(20,20,24,.8); padding: 6px 12px; border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<div id="bg"></div><div id="dim"></div><div id="sel"></div>
<div class="g" id="gv"></div><div class="g" id="gh"></div>
<div id="lbl"></div><div id="hint">Drag to select a region &middot; Esc / right-click to cancel</div>
<script src="overlay.js"></script>
</body>
</html>
