name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: ShareV-portable-win, path: dist/*portable.exe }
